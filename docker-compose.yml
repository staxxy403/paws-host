services:

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1
    command: python3 -m bot.main 
    env_file:
      - .env
  
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1
    command: uvicorn api.app:app --host 0.0.0.0 --port 8000
    ports:
      - 8000:8000
    env_file:
      - .env
  
  redis:
    image: redis:8.6-alpine
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1
    command: redis-server --port 6379 --requirepass ${REDIS_PASSWORD} --bind 0.0.0.0 --tcp-keepalive 60
    ports:
      - 6379:6379
    env_file:
      - .env
  
  db:
    image: postgres:16
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: